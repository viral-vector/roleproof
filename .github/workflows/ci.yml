name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Test CLI
        run: pnpm test:cli

      - name: Smoke test CLI help
        run: pnpm exec roleproof --help

      - name: Smoke test CLI version
        run: pnpm exec roleproof --version

      - name: Smoke test deterministic JSON analysis
        run: pnpm exec roleproof analyze --resume fixtures/phase-1/strong-match/resume.txt --job fixtures/phase-1/strong-match/job.txt --no-ai --format json --stdout

      - name: Smoke test deterministic Markdown analysis
        run: pnpm exec roleproof analyze --resume fixtures/phase-1/strong-match/resume.txt --job fixtures/phase-1/strong-match/job.txt --no-ai --format markdown --stdout
